<style>
:root{
  --oasis-dark:#231F20;
  --oasis-charcoal:#33373D;
  --oasis-gray:#3F444B;
  --oasis-teal:#226683;
  --oasis-navy:#1A405F;
  --oasis-aqua:#4A9FBF;
  --oasis-aqua-light:#D6ECF3;
  --oasis-cream:#F7F4EE;
  --oasis-paper:#FFFFFF;
  --oasis-line:#E6E1D7;
  --oasis-success:#2D8C5C;
  --oasis-success-bg:#E5F3EC;
  --oasis-error:#B23A2E;
  --oasis-error-bg:#FBEAE7;
  --oasis-warning:#C68A2E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow-sm:0 2px 8px rgba(35,31,32,.06);
  --shadow:0 8px 28px rgba(35,31,32,.1);
  --shadow-lg:0 18px 50px rgba(35,31,32,.18);
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--oasis-dark);
  background:var(--oasis-cream);
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--oasis-teal);text-decoration:none}
img{max-width:100%;display:block}

/* ========== Layout ========== */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  background:var(--oasis-dark);
  color:#fff;
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid #000;
}
.brand{display:flex;align-items:center;gap:18px}
.brand-logo{height:32px;width:auto;filter:none}
.brand-divider{width:1px;height:22px;background:rgba(255,255,255,.25)}
.brand-tag{font-family:var(--serif);font-weight:300;font-size:18px;letter-spacing:.18em;text-transform:uppercase;color:#fff}
.topbar-nav{display:flex;align-items:center;gap:14px}
.topbar-nav .who{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.btn-link{
  background:transparent;color:#fff;
  border:1px solid rgba(255,255,255,.35);
  padding:8px 14px;border-radius:999px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  transition:all .2s;
}
.btn-link:hover{background:#fff;color:var(--oasis-dark);border-color:#fff}

main{flex:1;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:36px 28px 80px}

/* ========== Footer ========== */
.footer{
  background:var(--oasis-dark);color:rgba(255,255,255,.75);
  padding:28px;margin-top:auto;
  border-top:1px solid #000;
}
.footer-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:18px;justify-content:center;text-align:center;
}
.footer-logo{height:36px;width:auto}
.footer-title{font-family:var(--serif);font-weight:300;color:#fff;font-size:16px;letter-spacing:.2em;text-transform:uppercase}
.footer-sub{font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.55);margin-top:2px}

/* ========== Welcome / Login ========== */
.welcome{
  min-height:calc(100vh - 80px);
  display:flex;align-items:center;justify-content:center;
  padding:40px 24px;
  background:
    linear-gradient(180deg,rgba(35,31,32,.78),rgba(34,102,131,.55)),
    radial-gradient(circle at 20% 0%, #2a6f93 0%, transparent 60%),
    radial-gradient(circle at 80% 90%, #1a405f 0%, transparent 50%),
    var(--oasis-dark);
  background-size:cover;
  position:relative;overflow:hidden;
}
.welcome::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.4) 100%);
  pointer-events:none;
}
.welcome-card{
  background:rgba(255,255,255,.97);
  border-radius:var(--radius);padding:48px 44px;
  width:100%;max-width:520px;
  box-shadow:var(--shadow-lg);
  position:relative;z-index:1;
  text-align:center;
}
.welcome-logo{height:46px;margin:0 auto 22px;filter:invert(1)}
.welcome-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--oasis-teal);margin-bottom:14px}
.welcome-title{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.1;letter-spacing:.02em;color:var(--oasis-dark);margin-bottom:12px}
.welcome-sub{color:var(--oasis-gray);font-size:15px;margin-bottom:32px}
.btn-primary{
  display:inline-block;
  background:var(--oasis-teal);color:#fff;
  padding:14px 32px;border-radius:999px;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  transition:all .2s;border:1px solid var(--oasis-teal);
}
.btn-primary:hover{background:var(--oasis-navy);border-color:var(--oasis-navy);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-ghost{
  display:inline-block;
  background:transparent;color:var(--oasis-dark);
  padding:14px 32px;border-radius:999px;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  border:1px solid var(--oasis-dark);transition:all .2s;
}
.btn-ghost:hover{background:var(--oasis-dark);color:#fff}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ========== Forms ========== */
.field{margin-bottom:18px;text-align:left}
.field label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oasis-gray);margin-bottom:8px;font-weight:500}
.field input,.field select{
  width:100%;padding:14px 16px;
  border:1px solid var(--oasis-line);border-radius:var(--radius-sm);
  background:#fff;font-size:16px;color:var(--oasis-dark);
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--oasis-teal);box-shadow:0 0 0 3px rgba(34,102,131,.15)}
.pin-input input{letter-spacing:.6em;text-align:center;font-size:22px;font-weight:500}
.muted{color:var(--oasis-gray);font-size:13px}
.error{color:var(--oasis-error);font-size:13px;margin-top:8px;min-height:18px}

/* ========== Profile chip list ========== */
.profile-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.profile-chip{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border:1px solid var(--oasis-line);border-radius:var(--radius-sm);
  background:#fff;cursor:pointer;text-align:left;width:100%;transition:all .15s;
}
.profile-chip:hover{border-color:var(--oasis-teal);background:var(--oasis-aqua-light)}
.profile-chip.selected{border-color:var(--oasis-teal);background:#fff;box-shadow:0 0 0 2px var(--oasis-teal) inset}
.profile-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--oasis-teal),var(--oasis-navy));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;letter-spacing:.05em;
}
.profile-meta{flex:1}
.profile-name{font-weight:500;color:var(--oasis-dark)}
.profile-stat{font-size:12px;color:var(--oasis-gray);letter-spacing:.06em}

/* ========== Dashboard ========== */
.hero{
  background:
    linear-gradient(135deg,rgba(35,31,32,.85),rgba(34,102,131,.7)),
    radial-gradient(circle at 80% 0%,#2a6f93,transparent 60%),
    var(--oasis-dark);
  color:#fff;border-radius:var(--radius);
  padding:36px 36px;
  position:relative;overflow:hidden;
  margin-bottom:28px;
}
.hero::after{
  content:"";position:absolute;right:-30px;bottom:-50px;width:280px;height:280px;
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);
  border-radius:50%;
}
.hero-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.hero-title{font-family:var(--serif);font-weight:300;font-size:38px;letter-spacing:.02em;line-height:1.15}
.hero-name{font-style:italic}
.hero-sub{margin-top:10px;opacity:.85;max-width:680px}
.hero-stats{display:flex;gap:32px;margin-top:24px;flex-wrap:wrap;position:relative;z-index:1}
.stat{}
.stat-num{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.stat-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-top:4px}
.hero-actions{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.btn-light{background:#fff;color:var(--oasis-dark);padding:12px 26px;border-radius:999px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:all .2s;border:1px solid #fff}
.btn-light:hover{background:transparent;color:#fff}
.btn-outline-light{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:12px 26px;border-radius:999px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:all .2s}
.btn-outline-light:hover{background:#fff;color:var(--oasis-dark);border-color:#fff}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 18px}
.section-title{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:.04em;color:var(--oasis-dark)}
.section-meta{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--oasis-gray)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

.module-card{
  background:#fff;border-radius:var(--radius);padding:22px;
  border:1px solid var(--oasis-line);
  display:flex;flex-direction:column;gap:14px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  cursor:pointer;position:relative;overflow:hidden;
}
.module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--oasis-teal)}
.module-card .card-num{font-family:var(--serif);font-size:14px;color:var(--oasis-teal);letter-spacing:.18em;text-transform:uppercase}
.module-card .card-title{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--oasis-dark);line-height:1.2}
.module-card .card-desc{font-size:13.5px;color:var(--oasis-gray);min-height:42px}
.bar{height:6px;background:var(--oasis-line);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--oasis-aqua),var(--oasis-teal));transition:width .4s}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-row .pct{font-size:12px;color:var(--oasis-gray);letter-spacing:.05em;min-width:38px;text-align:right}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
}
.badge-complete{background:var(--oasis-success-bg);color:var(--oasis-success)}
.badge-progress{background:var(--oasis-aqua-light);color:var(--oasis-teal)}
.badge-locked{background:#EFEAE0;color:var(--oasis-gray)}
.badge-unlocked{background:#FCEDC9;color:#8C6A1F}

.exam-card{
  background:linear-gradient(135deg,#1A405F,#226683);color:#fff;
  border-radius:var(--radius);padding:26px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:space-between;
  position:relative;overflow:hidden;
}
.exam-card.locked{
  background:linear-gradient(135deg,#5C5651,#3F3A36);color:rgba(255,255,255,.8);
}
.exam-card::before{
  content:"";position:absolute;left:-40px;top:-40px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border-radius:50%;
}
.exam-icon{
  width:62px;height:62px;border-radius:50%;
  background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
}
.exam-info{flex:1;min-width:220px}
.exam-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.exam-title{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:.04em;margin-top:4px}
.exam-desc{font-size:13px;opacity:.88;margin-top:6px;max-width:520px}
.exam-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.exam-best{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}

.unlock-banner{
  background:linear-gradient(90deg,rgba(74,159,191,.18),rgba(34,102,131,.06));
  border:1px solid rgba(34,102,131,.25);
  border-radius:var(--radius);padding:18px 22px;
  margin-bottom:18px;display:flex;align-items:center;gap:14px;
}
.unlock-banner .ring{font-size:22px}
.unlock-banner b{color:var(--oasis-teal);font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.04em}

/* ========== Module Page ========== */
.crumbs{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--oasis-gray);margin-bottom:14px}
.crumbs a{color:var(--oasis-gray)}
.module-head{
  background:#fff;border:1px solid var(--oasis-line);border-radius:var(--radius);
  padding:28px 28px;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.module-head::before{
  content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(74,159,191,.08),transparent 70%);border-radius:50%;
}
.module-head h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.15;letter-spacing:.02em;color:var(--oasis-dark);position:relative}
.module-head .num{color:var(--oasis-teal);font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-family:var(--sans);margin-bottom:4px}
.module-head p.intro{margin-top:10px;color:var(--oasis-gray);max-width:760px;position:relative}
.module-progress{display:flex;align-items:center;gap:16px;margin-top:18px;position:relative}
.module-progress .bar{flex:1;max-width:260px}

.section-card{
  background:#fff;border:1px solid var(--oasis-line);border-radius:var(--radius);
  padding:30px 32px;margin-bottom:18px;position:relative;
}
.section-card h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.02em;color:var(--oasis-dark);margin-bottom:8px;line-height:1.2}
.section-card .lead{color:var(--oasis-gray);font-size:14px;margin-bottom:14px;letter-spacing:.04em;text-transform:uppercase;font-size:11px;letter-spacing:.2em}
.section-card .body{color:var(--oasis-charcoal);font-size:15.5px;line-height:1.75}
.section-card .body p{margin-bottom:14px}
.section-card .body ul{margin:6px 0 14px 22px}
.section-card .body li{margin-bottom:6px}
.section-card .body strong{color:var(--oasis-dark)}
.section-mark{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--oasis-line)}
.read-toggle{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;
  border:1px solid var(--oasis-teal);color:var(--oasis-teal);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
  background:#fff;transition:all .2s;
}
.read-toggle:hover{background:var(--oasis-teal);color:#fff}
.read-toggle.done{background:var(--oasis-success);border-color:var(--oasis-success);color:#fff}
.read-toggle.done::before{content:"✓ ";margin-right:4px}

.quiz-block{
  background:linear-gradient(180deg,#fff,#FAF8F3);
  border:1px solid var(--oasis-line);border-radius:var(--radius);
  padding:26px 30px;margin-bottom:22px;position:relative;
  border-left:4px solid var(--oasis-teal);
}
.quiz-block.completion{border-left-color:var(--oasis-warning)}
.quiz-eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--oasis-teal);font-weight:500}
.quiz-block.completion .quiz-eyebrow{color:var(--oasis-warning)}
.quiz-title{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--oasis-dark);margin-top:4px}
.quiz-meta{font-size:13px;color:var(--oasis-gray);margin-top:4px;margin-bottom:16px}

.q-card{background:#fff;border:1px solid var(--oasis-line);border-radius:var(--radius-sm);padding:20px;margin-bottom:14px}
.q-prompt{font-weight:500;font-size:15.5px;color:var(--oasis-dark);margin-bottom:14px;line-height:1.45}
.q-num{color:var(--oasis-teal);letter-spacing:.06em;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;border:1px solid var(--oasis-line);border-radius:var(--radius-sm);
  cursor:pointer;background:#fff;transition:all .15s;font-size:14.5px;
}
.opt:hover{border-color:var(--oasis-teal);background:var(--oasis-aqua-light)}
.opt input{margin-top:3px;accent-color:var(--oasis-teal)}
.opt.correct{border-color:var(--oasis-success);background:var(--oasis-success-bg);color:var(--oasis-success);font-weight:500}
.opt.wrong{border-color:var(--oasis-error);background:var(--oasis-error-bg);color:var(--oasis-error);font-weight:500}
.opt.disabled{cursor:default}
.feedback{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px}
.feedback.correct{background:var(--oasis-success-bg);color:var(--oasis-success);border-left:3px solid var(--oasis-success)}
.feedback.wrong{background:var(--oasis-error-bg);color:var(--oasis-error);border-left:3px solid var(--oasis-error)}

.quiz-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap}
.quiz-score{font-size:14px;color:var(--oasis-gray)}
.quiz-score b{color:var(--oasis-dark)}

/* ========== Final Exam ========== */
.exam-shell{
  background:#fff;border-radius:var(--radius);
  border:1px solid var(--oasis-line);
  padding:0;overflow:hidden;
}
.exam-bar{
  background:linear-gradient(135deg,#1A405F,#226683);color:#fff;
  padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  position:sticky;top:60px;z-index:10;
}
.exam-bar .label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.75}
.exam-bar .timer{
  font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:.04em;
  background:rgba(255,255,255,.12);padding:6px 18px;border-radius:8px;
}
.exam-bar .timer.warn{background:rgba(255,160,80,.25);color:#FFD7A3}
.exam-bar .timer.danger{background:rgba(220,80,60,.35);color:#FFC9C2;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
.exam-progress-line{height:4px;background:rgba(255,255,255,.18);border-radius:99px;flex:1;min-width:200px;overflow:hidden}
.exam-progress-line .fill{height:100%;background:#fff;width:0%;transition:width .3s}
.exam-body{padding:30px}

.review-q{padding:20px;border-radius:var(--radius-sm);margin-bottom:14px;border:1px solid var(--oasis-line);background:#fff}
.review-q.wrong{border-left:4px solid var(--oasis-error);background:#FDF6F4}

<script>
"use strict";
/* ============================================================
   CPO Exam Prep — single-file app
   Branding: Oasis.ky (charcoal #231F20, teal #226683, navy #1A405F)
   Storage: localStorage key "cpo_app_v1"
   ============================================================ */

// ---------------- COURSE CONTENT ----------------
const MODULES = [
  // ============ MODULE 1: Water Chemistry ============
  {
    id:"m1",
    title:"Pool & Spa Water Chemistry",
    intro:"Master the four pillars of balanced water — pH, total alkalinity, calcium hardness, and total dissolved solids — and learn how to use the Langelier Saturation Index to keep water clear, comfortable, and non-corrosive.",
    sections:[
      {
        title:"Why Water Balance Matters",
        body:`<p>Water that is out of balance becomes a problem before it becomes a hazard. Eyes sting, surfaces etch, equipment scales, and chlorine works inefficiently or not at all. Balanced water keeps swimmers comfortable, sanitizers effective, and the facility's expensive plaster, grout, heaters, and metal components protected from premature failure.</p>
        <p>The CPO is responsible for monitoring four chemical factors that, taken together, define balance:</p>
        <ul>
          <li><strong>pH</strong> — the acid/base activity of the water.</li>
          <li><strong>Total Alkalinity (TA)</strong> — the water's resistance to pH change.</li>
          <li><strong>Calcium Hardness (CH)</strong> — dissolved calcium content.</li>
          <li><strong>Temperature</strong> and <strong>Total Dissolved Solids (TDS)</strong> — the environmental backdrop.</li>
        </ul>
        <p>Balance is judged using the <strong>Langelier Saturation Index (LSI)</strong>. A reading near zero means the water is neither aggressive (corrosive) nor scaling.</p>`
      },
      {
        title:"pH — The Master Variable",
        body:`<p>pH is a 0–14 logarithmic scale measuring how acidic or basic the water is. Pool water is held in a narrow window: <strong>7.2–7.8</strong>, with 7.4–7.6 ideal because it sits closest to the pH of the human eye (about 7.4) and keeps chlorine working efficiently.</p>
        <p><strong>What happens outside the range:</strong></p>
        <ul>
          <li>pH below 7.2 — chlorine is overly aggressive, eyes burn, metal surfaces corrode, plaster etches.</li>
          <li>pH above 7.8 — chlorine becomes sluggish, scale begins to form, water clouds, and sanitizer demand rises.</li>
        </ul>
        <p><strong>Adjusting pH:</strong></p>
        <ul>
          <li>To <em>raise</em> pH: sodium carbonate (soda ash) or sodium bicarbonate.</li>
          <li>To <em>lower</em> pH: muriatic acid (hydrochloric acid) or sodium bisulfate (dry acid).</li>
        </ul>
        <p>Always pre-dilute liquid acid by adding acid to water (never water to acid), broadcast over the deepest part of the pool with the pump running, and re-test 30+ minutes after circulation.</p>`
      },
      {
        title:"Total Alkalinity — The Buffer",
        body:`<p>Total Alkalinity measures the carbonate, bicarbonate, and hydroxide ions in the water. TA acts as a chemical shock absorber that keeps pH stable. Without enough TA, pH bounces around with every chemical addition or rainfall (called &ldquo;pH bounce&rdquo;). With too much TA, pH drifts upward and locks in place (&ldquo;pH lock&rdquo;).</p>
        <p><strong>Ideal range:</strong> 80–120 ppm (60–180 ppm acceptable, depending on sanitizer).</p>
        <ul>
          <li>To raise TA: <strong>sodium bicarbonate</strong> (baking soda).</li>
          <li>To lower TA: muriatic acid or sodium bisulfate, added in slugs to the deepest point with the pump <em>off</em> for ~1 hour, then circulated.</li>
        </ul>
        <p>When using cyanuric acid (CYA) as a stabilizer, the &ldquo;adjusted&rdquo; TA is what matters. Carbonate alkalinity = Total Alkalinity – (CYA × correction factor).</p>`
      },
      {
        title:"Calcium Hardness, TDS & Temperature",
        body:`<p><strong>Calcium Hardness (CH)</strong> measures dissolved calcium. Too little CH and water becomes &ldquo;hungry,&rdquo; pulling calcium out of plaster, grout, and concrete. Too much CH and the water scales onto heaters, salt cells, tile lines, and filter media.</p>
        <p><strong>Ideal range for pools:</strong> 200–400 ppm (150–250 ppm for spas, where higher temperatures accelerate scale).</p>
        <ul>
          <li>To raise CH: <strong>calcium chloride</strong> (do not pre-mix in metal containers — it reacts exothermically).</li>
          <li>To lower CH: partial drain and refill with softer water; chemical removal is rarely practical.</li>
        </ul>
        <p><strong>Total Dissolved Solids (TDS)</strong> is the sum of every dissolved mineral, salt, and chemical residue. Maximum recommended TDS is 1500 ppm above the source water's starting TDS. High TDS dulls sanitizer effectiveness, can corrode metal fittings, and may cause cloudy water that no chemical can fix. The only effective treatment is dilution by partial drain and refill.</p>
        <p><strong>Water temperature</strong> drives chemical reactions. Warmer water = faster sanitizer demand, faster scale formation, and a higher LSI value. Spa water (typically 100–104 °F) requires more frequent testing than pool water and tighter chemistry control.</p>`
      },
      {
        title:"Langelier Saturation Index (LSI)",
        body:`<p>The LSI predicts whether water will scale or corrode by combining pH, temperature, calcium hardness, alkalinity, and TDS into a single number.</p>
        <p><strong>Formula:</strong> LSI = pH + TF + CF + AF − TDSF</p>
        <ul>
          <li><strong>TF</strong> — temperature factor (lookup table)</li>
          <li><strong>CF</strong> — calcium hardness factor (lookup table)</li>
          <li><strong>AF</strong> — adjusted alkalinity factor (lookup table)</li>
          <li><strong>TDSF</strong> — TDS constant (12.1 if TDS &lt; 1000 ppm; 12.2 if higher)</li>
        </ul>
        <p><strong>Reading the index:</strong></p>
        <ul>
          <li><strong>−0.3 to +0.3</strong> — balanced water (target).</li>
          <li>Negative number — corrosive (aggressive); etching, pitting, dissolved metals.</li>
          <li>Positive number — scaling; calcium deposits on heaters, surfaces, and tile lines.</li>
        </ul>
        <p>Practical takeaway: most CPO problems show up as drift in pH or alkalinity. Catching them early — via daily testing — keeps the LSI inside the safe band without needing dramatic chemical interventions.</p>`
      },
      {
        title:"Stabilizer (Cyanuric Acid)",
        body:`<p>UV radiation from sunlight destroys free chlorine quickly. Outdoors, an unstabilized pool can lose 90% of its free chlorine within two hours of midday sun. <strong>Cyanuric acid (CYA)</strong> — also called &ldquo;stabilizer&rdquo; or &ldquo;conditioner&rdquo; — bonds reversibly with chlorine to shield it from UV, dramatically extending its working life.</p>
        <p><strong>Ideal CYA range:</strong> 30–50 ppm for outdoor pools (some health codes cap CYA at 100 ppm). Indoor pools generally do <em>not</em> need CYA.</p>
        <p>Trade-off: CYA also <em>slows</em> chlorine's ability to kill pathogens. As a rule of thumb, free chlorine should be at least 7.5% of the CYA reading (the &ldquo;FC/CYA ratio&rdquo;). Excess CYA (&gt;100 ppm) is removed only by partial drain and refill.</p>
        <p>Trichlor tablets and dichlor granular shock both add CYA every time they are used. Operators tracking CYA creep on a stabilized pool should plan for periodic dilution.</p>`
      }
    ],

          {q:"Which chemical is most commonly used to raise total alkalinity?", a:["Sodium carbonate (soda ash)","Sodium bicarbonate (baking soda)","Calcium chloride","Muriatic acid"], c:1, e:"Sodium bicarbonate is the standard chemical for raising total alkalinity. Soda ash also raises alkalinity but is primarily used to raise pH."},
          {q:"What is likely to happen when total alkalinity exceeds 180 ppm?", a:["pH bounce","pH lock","Algae bloom","Chlorine spike"], c:1, e:"High alkalinity locks pH at high levels — &lsquo;pH lock&rsquo; — and makes adjustments very difficult. The water also tends to scale."},
          {q:"To lower pH in a pool, you would typically add:", a:["Sodium bicarbonate","Calcium hypochlorite","Muriatic acid","Soda ash"], c:2, e:"Muriatic acid (or dry acid / sodium bisulfate) is added to lower pH. Soda ash and bicarb both raise pH or alkalinity."},
          {q:"pH measures:", a:["Sanitizer strength","Hardness of the water","Acidity or basicity of the water","Total dissolved solids"], c:2, e:"pH is a 0–14 scale measuring the hydrogen ion activity — how acidic or basic the water is."}
        ]
      },
      {
        afterSection:5,
        title:"Mini Quiz — Hardness, TDS & LSI",
        questions:[
          {q:"The recommended calcium hardness range for a swimming pool is:", a:["50 – 150 ppm","100 – 200 ppm","200 – 400 ppm","400 – 600 ppm"], c:2, e:"PHTA recommends 200–400 ppm for pools. Spas are kept lower (150–250 ppm) because heat accelerates scale."},
          {q:"A Langelier Saturation Index of −0.8 indicates water that is:", a:["Balanced","Corrosive","Scaling","Sanitized"], c:1, e:"Negative LSI values indicate corrosive (aggressive) water that will etch plaster and dissolve metals."},
          {q:"Cyanuric acid is used to:", a:["Raise pH","Reduce hardness","Protect chlorine from UV degradation","Sanitize the pool"], c:2, e:"Cyanuric acid is a stabilizer/conditioner. It bonds with chlorine to shield it from UV breakdown in outdoor pools."},
          {q:"To lower TDS in a pool you must:", a:["Add a clarifier","Run the filter longer","Partially drain and refill","Shock with chlorine"], c:2, e:"There is no chemical that removes TDS. Dilution by partial drain and refill is the only effective method."},
          {q:"For an outdoor pool, the recommended cyanuric acid range is:", a:["0 – 10 ppm","30 – 50 ppm","100 – 150 ppm","Over 200 ppm"], c:1, e:"30–50 ppm is ideal. Most health codes cap CYA at 100 ppm because higher levels reduce chlorine effectiveness."}
        ]
      }
    ],
    completionQuiz:{
      title:"Module 1 Completion Quiz — Water Chemistry",
      questions:[
        {q:"Which factor most influences the activity of free chlorine?", a:["Total dissolved solids","pH","Calcium hardness","Total alkalinity"], c:1, e:"Free chlorine effectiveness drops dramatically as pH rises. At pH 8.0, less than 25% of free chlorine exists in the active hypochlorous acid form."},
        {q:"The ideal total alkalinity range for a chlorine-sanitized pool is:", a:["20 – 60 ppm","80 – 120 ppm","150 – 200 ppm","250 – 300 ppm"], c:1, e:"80 – 120 ppm is the ideal carbonate alkalinity range. It buffers pH without causing scale or pH lock."},
        {q:"You test pH at 7.9 and TA at 110 ppm. What is the best correction?", a:["Add soda ash","Add muriatic acid","Add calcium chloride","Add bicarbonate"], c:1, e:"pH is too high; TA is in range. Adding muriatic acid will lower pH with only a small effect on TA at this level."},

  // ============ MODULE 2: Disinfection & Sanitizers ============
  {
    id:"m2",
    title:"Disinfection & Sanitizers",
    intro:"Understand how chlorine and alternative sanitizers actually kill pathogens, the difference between free, combined, and total chlorine, and how to manage breakpoint chlorination, oxidation, and supplemental systems like UV and ozone.",
    sections:[
      {
        title:"How Chlorine Disinfects",
        body:`<p>Every chlorine product, regardless of form, dissolves in water to release <strong>hypochlorous acid (HOCl)</strong> — the active disinfecting molecule. HOCl is small, neutrally charged, and able to penetrate microbial cell walls, where it destroys enzymes and proteins.</p>
        <p>HOCl exists in equilibrium with the much weaker <strong>hypochlorite ion (OCl⁻)</strong>. The split between the two is governed almost entirely by pH:</p>
        <ul>
          <li>At pH 7.0 — about 75% HOCl (very active)</li>
          <li>At pH 7.5 — about 50% HOCl (good balance)</li>
          <li>At pH 8.0 — about 22% HOCl (sluggish)</li>
        </ul>
        <p>This is why pH control isn't a separate task from sanitation — pH <em>is</em> sanitation control. A pool with 2 ppm chlorine at pH 7.4 is far more effective than a pool with 4 ppm chlorine at pH 8.0.</p>`
      },
      {
        title:"Free, Combined & Total Chlorine",
        body:`<p>Three chlorine readings are reported on every test:</p>
        <ul>
          <li><strong>Free chlorine (FC)</strong> — HOCl + OCl⁻; the disinfecting reserve.</li>
          <li><strong>Combined chlorine (CC, &ldquo;chloramines&rdquo;)</strong> — chlorine that has reacted with ammonia/nitrogen from sweat, urine, body oils. Weak disinfectants and the source of the &ldquo;chlorine smell&rdquo; and red eyes.</li>
          <li><strong>Total chlorine (TC)</strong> — FC + CC.</li>
        </ul>
        <p><strong>Targets:</strong> FC 1–4 ppm in pools (2–4 ppm typical); 3–5 ppm in spas. CC should be kept &lt; 0.4 ppm (some health codes require &lt; 0.2 ppm).</p>
        <p>To find combined chlorine: <code>CC = TC − FC</code>.</p>`
      },
      {
        title:"Breakpoint Chlorination & Shocking",
        body:`<p>To destroy chloramines you must &ldquo;shock&rdquo; the pool past the <strong>breakpoint</strong> — the chlorine concentration at which combined chlorine is oxidized into harmless gases.</p>
        <p><strong>Rule of thumb:</strong> Add free chlorine equal to 10× the combined chlorine reading to reach breakpoint.</p>
        <p>Example: CC = 0.6 ppm → shock to FC of 6 ppm above current level.</p>
        <p>Common shock products:</p>
        <ul>
          <li><strong>Calcium hypochlorite</strong> — 65–73% available chlorine; raises CH; broadcast over deep end.</li>
          <li><strong>Sodium hypochlorite (liquid bleach)</strong> — 10–12.5% available chlorine; raises pH slightly; no CH increase.</li>
          <li><strong>Dichlor</strong> — 56–62% available chlorine; adds CYA; near-neutral pH.</li>
          <li><strong>Non-chlorine shock (potassium monopersulfate)</strong> — oxidizer only; does not destroy pathogens but breaks down combined chlorine.</li>
        </ul>
        <p>Shock late in the day, with pumps running, and keep swimmers out until FC returns to ≤ 4 ppm.</p>`
      },
      {
        title:"Chlorine Source Comparison",
        body:`<p>The CPO must be able to evaluate chlorine products by available chlorine, pH effect, stabilizer content, and storage hazards.</p>
        <ul>
          <li><strong>Trichlor (tablets, sticks)</strong> — 90% available; very acidic (pH ~2.8); adds CYA.</li>
          <li><strong>Dichlor (granular)</strong> — 56–62% available; near-neutral; adds CYA.</li>
          <li><strong>Cal-hypo</strong> — 65–73%; basic (pH ~11.7); adds CH; do NOT mix with trichlor.</li>
          <li><strong>Liquid bleach (sodium hypo)</strong> — 10–12.5%; basic (pH ~13); short shelf life; degrades in heat.</li>
          <li><strong>Lithium hypochlorite</strong> — 35%; basic; expensive; dissolves quickly.</li>
          <li><strong>Salt-chlorine generators</strong> — produce chlorine on-site by electrolysis of dissolved salt (3,000–4,000 ppm); near-neutral effect; require regular cell cleaning.</li>
        </ul>
        <p><strong>Critical safety rule:</strong> Never mix chlorine types in storage or feeders. Trichlor + cal-hypo can ignite, even from trace contamination.</p>`
      },
      {
        title:"Bromine, UV, Ozone & Alternative Sanitizers",
        body:`<p><strong>Bromine</strong> is widely used in spas because it is more stable in hot water and combined bromine (bromamines) remains an effective disinfectant. Range: 3–5 ppm in spas, 2–4 ppm in pools. Bromine cannot be stabilized with CYA.</p>
        <p><strong>UV systems</strong> pass water through a chamber illuminated by UV-C lamps that destroy DNA in pathogens — including chlorine-resistant <em>Cryptosporidium</em>. UV is a supplemental system; a chlorine residual is still required in the pool.</p>
        <p><strong>Ozone (O₃)</strong> is a powerful oxidizer generated on-site, injected, and then off-gassed before water returns to the pool. Like UV, ozone supplements chlorine — it does not replace the residual.</p>
        <p><strong>Mineral / copper-silver systems</strong> reduce — but do not eliminate — the need for chlorine. They are bacteriostatic, not bactericidal at the speeds health codes require.</p>
        <p>For aquatic facilities serving the public, U.S. health codes universally require an EPA-registered residual sanitizer (chlorine or bromine) regardless of supplemental systems.</p>`
      }
    ],

  // ============ MODULE 3: Pool Filtration Systems ============
  {
    id:"m3",
    title:"Pool Filtration Systems",
    intro:"Filtration removes the particles sanitizers can't oxidize. The CPO must understand sand, cartridge, and DE filter operation, turnover rate, flow management, and the indicators that tell you when to backwash, clean, or recharge each type.",
    sections:[
      {
        title:"Why Filtration Matters",
        body:`<p>Sanitizers kill living organisms; <strong>filtration removes the dead bodies, debris, dust, oils, and lotion residue</strong> that make water cloudy and consume chlorine. A pool that fails its turbidity check almost always has a filtration problem, not a chemistry problem.</p>
        <p>Three main filter types are used in commercial pools: <strong>sand</strong>, <strong>cartridge</strong>, and <strong>diatomaceous earth (DE)</strong>. Each filters down to a different particle size and is cleaned by a different method.</p>`
      },
      {
        title:"Sand Filters",
        body:`<p>The most common commercial filter type. Water is forced down through a bed of #20 silica sand. Particles ~20–25 microns and larger are trapped.</p>
        <ul>
          <li><strong>Design flow:</strong> 15 gpm/sq ft (high-rate); 3 gpm/sq ft (rapid, older).</li>
          <li><strong>Cleaning:</strong> reverse the flow ("backwash") to lift and rinse the sand bed when pressure rises 8–10 psi above clean baseline.</li>
          <li><strong>Sand replacement:</strong> every 5–7 years, or when channels form and filtration suffers.</li>
        </ul>
        <p>Adding a small amount of <strong>filter aid</strong> (DE or polymer) can boost particle capture down to ~5 microns. Sand filters are tolerant, forgiving, and require minimal labor — but use the most water for cleaning (200–500 gallons per backwash).</p>`
      },
      {
        title:"Cartridge Filters",
        body:`<p>Pleated polyester cartridges trap particles ~10–15 microns. Cleaning is manual: shut down, remove, hose off, optionally degrease/acid-soak.</p>
        <ul>
          <li><strong>Design flow:</strong> ≤ 0.375 gpm/sq ft (commercial), with most designs in the 0.25–0.375 range.</li>
          <li><strong>No backwash water</strong> — major water savings.</li>
          <li>Replace cartridges every 1–3 years depending on bather load.</li>
        </ul>
        <p>Cartridges shine in regions with water restrictions and on small-to-medium commercial pools where the labor of manual cleaning is acceptable.</p>`
      },
      {
        title:"DE (Diatomaceous Earth) Filters",
        body:`<p>DE filters provide the finest filtration available — down to ~3–5 microns — using a coating of fossilized diatom skeletons (DE powder) on cloth or grid elements.</p>
        <ul>
          <li><strong>Design flow:</strong> ≤ 2 gpm/sq ft.</li>
          <li><strong>Cleaning:</strong> backwash, then re-coat (&ldquo;precoat&rdquo;) the grids with fresh DE through the skimmer.</li>
          <li>Some health codes require DE backwash water be discharged through a separation tank to avoid releasing DE into sewers/storm drains.</li>
        </ul>
        <p>DE provides the cleanest water but requires more operator attention, careful precoating, and respiratory protection (DE dust is a known lung irritant — handle with N95 mask).</p>`
      },
      {
        title:"Turnover Rate & Flow Management",
        body:`<p>The <strong>turnover rate</strong> is the time required for the filtration system to circulate a volume of water equal to the entire pool volume.</p>
        <p><strong>Required turnover (PHTA / MAHC defaults):</strong></p>
        <ul>
          <li>Pools — 6 hours or less</li>
          <li>Wading pools — 1 hour</li>
          <li>Spas — 30 minutes</li>
          <li>Spray pads — 30 seconds (continuous)</li>
        </ul>
        <p><strong>Required flow rate (gpm) = Pool volume (gal) ÷ (Turnover time in hours × 60)</strong>. Example: a 60,000-gallon pool with 6-hour turnover needs 60,000 / (6 × 60) = 167 gpm.</p>
        <p>Use the filter pressure gauge (pre-filter) and flow meter to monitor performance. Backwash sand/DE when pressure rises 8–10 psi above clean baseline; clean cartridges on the same trigger.</p>`
      },
      {
        title:"Backwashing Procedure & Common Problems",
        body:`<p><strong>Sand filter backwash steps:</strong></p>
        <ol>
          <li>Shut off pump.</li>
          <li>Move multiport valve to BACKWASH (never with pump running).</li>
          <li>Restart pump; backwash 2–3 minutes (or until sight glass runs clear).</li>
          <li>Shut off pump; valve to RINSE; run 30 seconds.</li>
          <li>Shut off pump; valve to FILTER; restart.</li>
        </ol>
        <p><strong>Common problems:</strong> Channeling (water bypasses sand) — replace sand. Mudballing (clumped wet sand) — chemically clean or replace. Calcium scale — acid-clean. Rising pressure with no debris — undersized pump or restricted return.</p>`
      }
    ],
    miniQuizzes:[
      {
        afterSection:2,
        title:"Mini Quiz — Sand Filters",
        questions:[
          {q:"A sand filter typically traps particles down to:", a:["1 micron","5 microns","20 microns","100 microns"], c:2, e:"Sand filters reach about 20–25 microns. Adding DE or polymer filter aid can improve this to ~5 microns."},
          {q:"You should backwash a sand filter when pressure rises:", a:["1–2 psi over clean baseline","8–10 psi over clean baseline","20+ psi over clean baseline","Pressure does not matter"], c:1, e:"The standard trigger is 8–10 psi above the clean operating pressure."},
          {q:"High-rate sand filter design flow is:", a:["1 gpm/sq ft","3 gpm/sq ft","15 gpm/sq ft","45 gpm/sq ft"], c:2, e:"High-rate sand operates at up to 15 gpm/sq ft. Older &lsquo;rapid&rsquo; designs operate at ~3 gpm/sq ft."},

  // ============ MODULE 4: Pool Operations & Maintenance ============
  {
    id:"m4",
    title:"Pool Operations & Maintenance",
    intro:"Daily operations turn classroom chemistry into clean, safe water. This module covers test kits, recordkeeping, calibration, brushing and vacuuming routines, contamination response, and the operational rhythm that prevents problems before they occur.",
    sections:[
      {
        title:"Test Kits & Daily Testing",
        body:`<p>The CPO is the data scientist of the pool deck — a small notebook of daily readings is the most powerful prevention tool you have.</p>
        <p><strong>Approved test methods (in order of accuracy):</strong></p>
        <ul>
          <li><strong>DPD with photometer</strong> — most accurate; reads free, combined, and total chlorine to 0.1 ppm.</li>
          <li><strong>DPD with color comparator</strong> — standard for routine testing; affordable and reliable.</li>
          <li><strong>OTO (orthotolidine)</strong> — measures total chlorine only; older method, less precise.</li>
          <li><strong>Test strips</strong> — fast, screening only; not adequate as the sole compliance test.</li>
        </ul>
        <p><strong>Required testing frequency:</strong> Free/combined chlorine and pH every 2–4 hours during operation; alkalinity, calcium hardness, and CYA weekly. Spa testing should be at least every 2 hours.</p>
        <p>Reagents are dated — a DPD reagent older than 12 months loses sensitivity and gives false-low readings. Replace annually and store cool/dark.</p>`
      },
      {
        title:"Recordkeeping & Documentation",
        body:`<p>Every public-pool jurisdiction requires a <strong>daily operations log</strong> retained for inspection, often for 3–5 years. Required entries typically include:</p>
        <ul>
          <li>Free chlorine, combined chlorine, pH (each test)</li>
          <li>Bather load and operating hours</li>
          <li>Chemicals added (type, quantity, time)</li>
          <li>Cleaning, vacuuming, backwashing notes</li>
          <li>Equipment problems / corrective actions</li>
          <li>Contamination events and response steps</li>
        </ul>
        <p>Logs are protective — they document compliance, defend against liability, and surface drift before it becomes failure. Use a bound notebook, locked spreadsheet, or commercial pool-management software; loose pages are easily lost.</p>`
      },
      {
        title:"Brushing, Vacuuming & Surface Care",
        body:`<p>Even with perfect chemistry and filtration, biofilm forms on tile lines, ladders, and steps. Manual care is non-negotiable.</p>
        <ul>
          <li><strong>Brush walls and floor</strong> daily for plaster, weekly for vinyl/fiberglass. Use a stiff brush on plaster, soft only on vinyl.</li>
          <li><strong>Vacuum</strong> as needed — daily for high-debris environments, weekly minimum.</li>
          <li><strong>Skimmer baskets:</strong> empty daily; pump baskets at least weekly.</li>
          <li><strong>Tile line:</strong> wipe with mild detergent or specialty tile cleaner monthly to prevent calcium scale buildup.</li>
        </ul>
        <p>Algae prevention starts with circulation. Brush dead zones — corners, behind ladders, deep-end transitions — where chlorine doesn't reach as effectively.</p>`
      },
      {
        title:"Contamination Response (Fecal & Vomit)",
        body:`<p>Health codes set explicit response procedures for contamination. PHTA and CDC published the &ldquo;Healthy Swimming&rdquo; protocols that most jurisdictions adopt.</p>
        <p><strong>Formed-stool fecal accident:</strong></p>
        <ol>
          <li>Close the affected pool.</li>
          <li>Remove the stool with a net (do not vacuum).</li>
          <li>Disinfect the net.</li>
          <li>Raise FC to 2 ppm at pH 7.5; maintain for 25 minutes (CT = 50).</li>
          <li>Reopen.</li>
        </ol>
        <p><strong>Diarrheal accident (Crypto risk):</strong></p>
        <ol>
          <li>Close the pool — extended.</li>
          <li>Remove material with a net; disinfect.</li>
          <li>Raise FC to 20 ppm at pH ≤ 7.5 with stabilizer ideally at zero (CYA inhibits Crypto kill).</li>
          <li>Maintain 20 ppm for 12.75 hours (CT = 15,300).</li>
          <li>Filter, backwash thoroughly, then return chlorine to normal.</li>
        </ol>
        <p>Document everything — time, who, action, restart time. Vomit and blood follow similar protocols (close, treat to 2 ppm at pH 7.5 for 25 minutes).</p>`
      },
      {
        title:"Daily, Weekly & Monthly Tasks",
        body:`<p><strong>Daily:</strong> chlorine + pH test (every 2–4 hrs); empty skimmer baskets; check chemical feeder reservoirs; visual inspection of decks, drains, signage; brief log entry.</p>
        <p><strong>Weekly:</strong> alkalinity / calcium hardness / CYA test; brush all surfaces; vacuum; clean pump basket; check filter pressure; inspect main drain cover.</p>
        <p><strong>Monthly:</strong> calibrate test kit / photometer; tile line cleaning; inspect deck drains and gutters; verify rescue equipment present and serviceable; review staff in-service.</p>
        <p><strong>Quarterly / seasonally:</strong> filter media inspection; chemical feeder rebuild; flow meter accuracy check; emergency action plan rehearsal.</p>
        <p><strong>Annually:</strong> sand replacement check; full electrical / GFCI test; suction outlet cover inspection; recertify CPO if expiring.</p>`
      }
    ],

  // ============ MODULE 5: Health Codes & Regulations ============
  {

    title:"Health Codes & Regulations",
    intro:"From the federal VGB Act to local health departments, public pools operate inside a tight regulatory frame. This module covers the Model Aquatic Health Code (MAHC), the Virginia Graeme Baker Pool & Spa Safety Act, ADA accessibility, and the legal duty of the CPO.",
    sections:[
      {
        title:"The Model Aquatic Health Code (MAHC)",
        body:`<p>Authored by the CDC, the MAHC is a voluntary model code that state and local jurisdictions adopt and adapt. Its goal is to reduce drowning, injury, and recreational water illness through consistent design, construction, and operational standards.</p>
        <p>Key MAHC provisions for operators:</p>
        <ul>
          <li>Free chlorine 1–10 ppm; combined chlorine ≤ 0.4 ppm</li>
          <li>pH 7.2–7.8</li>
          <li>Cyanuric acid ≤ 90 ppm (some jurisdictions cap at 100)</li>
          <li>Required testing intervals (chlorine + pH every 2–4 hrs minimum)</li>
          <li>Bather load limits and water-line freeboard</li>
          <li>Lifeguard staffing ratios (when required)</li>
          <li>Posted depths, no-diving signs, emergency phone</li>
        </ul>
        <p>The MAHC is not law in itself — it becomes enforceable only when adopted by a state or county. Always confirm the locally-applicable code.</p>`
      },
      {
        title:"VGB Pool & Spa Safety Act",
        body:`<p>The <strong>Virginia Graeme Baker (VGB) Pool & Spa Safety Act</strong>, signed in 2007 and effective December 19, 2008, was passed in response to the 2002 entrapment death of seven-year-old Virginia Graeme Baker.</p>
        <p>VGB requires:</p>
        <ul>
          <li>All public pools and spas to have <strong>ANSI/APSP-16 compliant suction outlet covers</strong> (anti-entrapment).</li>
          <li>Single main drain installations to add a secondary protection: <strong>SVRS</strong> (Safety Vacuum Release System), gravity drainage, suction-limiting vent, automatic pump shut-off, OR a properly designed dual main drain system separated by at least 3 feet.</li>
          <li>Drain cover certification life of 5–7 years (per manufacturer).</li>
        </ul>
        <p>Failure to comply is a federal violation enforced by the Consumer Product Safety Commission (CPSC). The CPO must verify cover certifications during inspections.</p>`
      },
      {
        title:"ADA Accessibility Requirements",
        body:`<p>The 2010 ADA Standards require public pools and spas to provide accessible entry/exit. As of January 31, 2013, fixed-equipment installation is required.</p>
        <ul>
          <li><strong>Pools &lt; 300 linear feet of pool wall:</strong> at least one accessible means (lift OR sloped entry).</li>
          <li><strong>Pools ≥ 300 linear feet:</strong> at least two accessible means, one of which must be a lift or sloped entry.</li>
          <li><strong>Spas:</strong> at least one of: lift, transfer wall, or transfer system. Where multiple spas are provided in a cluster, only 5% (minimum 1) must be accessible.</li>
        </ul>
        <p>Lifts must be permanently affixed (not portable), available at all times the pool is open, with controls operable from both deck and water.</p>`
      },
      {
        title:"Bather Load, Signage & Inspections",
        body:`<p><strong>Bather load</strong> is the maximum number of swimmers permitted at one time. The MAHC formula is approximately:</p>
        <ul>
          <li>Shallow water (&lt; 5 ft): 15 sq ft per bather.</li>
          <li>Deep water (≥ 5 ft): 20 sq ft per bather.</li>
          <li>Diving area: 300 sq ft per board.</li>

        <p><strong>Required signage</strong> commonly includes: posted depths and slope; &ldquo;No diving&rdquo; in shallow areas; pool rules; emergency phone location; bather load capacity; pool hours; suction outlet warning.</p>
        <p>Health-department inspections are typically annual, with unannounced re-inspections triggered by complaints, illness reports, or prior violations. Maintain logs, certifications, and equipment receipts in an organized binder for inspector review.</p>`

  // ============ MODULE 6: Safety, Emergency Response & First Aid ============
  {
    id:"m6",
    title:"Safety, Emergency Response & First Aid",
    intro:"A CPO's most important job is preventing injury — and being prepared when prevention fails. This module covers entrapment prevention, recreational water illness, emergency action planning, basic first aid, AED use, chemical exposure, and lightning protocols.",
    sections:[
      {
        title:"Entrapment & Drain Safety",
        body:`<p>Five recognized types of suction entrapment can injure or kill swimmers:</p>
        <ol>
          <li><strong>Body entrapment</strong> — torso seals against a flat or partially blocked drain.</li>
          <li><strong>Limb entrapment</strong> — arm or leg slips into a broken cover.</li>
          <li><strong>Hair entrapment</strong> — long hair flows into a grate and becomes wrapped.</li>
          <li><strong>Mechanical entrapment</strong> — jewelry, swimsuit, finger caught in a fitting.</li>
          <li><strong>Evisceration / disembowelment</strong> — exposed suction inlet creates internal injury.</li>
        </ol>
        <p>Prevention: VGB-compliant covers in good condition, dual main drains separated by ≥ 3 ft (or other approved secondary system), regular weekly visual inspection, and immediate pool closure if any cover is missing or damaged.</p>`
      },
      {
        title:"Recreational Water Illness (RWI)",
        body:`<p>RWIs are illnesses spread by contact with contaminated recreational water. The most common include:</p>
        <ul>
          <li><strong>Cryptosporidium</strong> (&ldquo;Crypto&rdquo;) — chlorine-resistant; the leading cause of pool outbreaks.</li>
          <li><strong>Giardia</strong> — protozoan; resistant to normal chlorine but killed by elevated levels.</li>
          <li><strong>E. coli O157:H7</strong> — bacterial; killed quickly by chlorine but spreads via diarrhea.</li>
          <li><strong>Pseudomonas aeruginosa</strong> — bacterial; causes &ldquo;hot tub rash&rdquo; and otitis externa (swimmer's ear).</li>
          <li><strong>Norovirus</strong> — viral; chlorine-sensitive but extremely contagious.</li>
          <li><strong>Legionella</strong> — bacterial; aerosolized water from spas; causes pneumonia.</li>
        </ul>
        <p>Prevention: maintain residual chlorine, manage pH for HOCl efficiency, post hygiene signage (shower before swim, no swim with diarrhea, frequent restroom breaks for kids), keep CYA in check (especially for Crypto outbreak response), and follow CDC's contamination response procedures.</p>`
      },
      {
        title:"Emergency Action Plan (EAP)",
        body:`<p>Every public aquatic facility must have a written, posted, and rehearsed Emergency Action Plan covering at least: drowning, suspected spinal injury, fecal/vomit/blood contamination, chemical spill, severe weather, fire, and missing-person procedures.</p>
        <p><strong>Required EAP elements:</strong></p>
        <ul>
          <li>Roles and responsibilities (lifeguard, CPO, manager, EMS liaison).</li>
          <li>Emergency phone location and posted numbers (911, poison control, facility manager).</li>
          <li>Equipment locations: AED, first-aid kit, backboard, oxygen, emergency shut-off.</li>
          <li>Evacuation routes and assembly points.</li>
          <li>Rehearsal frequency (commonly monthly drills documented in the log).</li>
        </ul>
        <p>The EAP must be available to all staff and inspectors; new hires are trained on it before solo duty.</p>`
      },
      {
        title:"First Aid, CPR & AED Basics",
        body:`<p>Lifeguards are required to be CPR/AED certified; CPOs and managers commonly hold the same. Core skills:</p>
        <ul>
          <li><strong>Recognize a drowning</strong> — drowning is silent: vertical body, head tilted back, no splashing.</li>
          <li><strong>Activate the EAP</strong> — call 911 first, then begin care.</li>
          <li><strong>CPR</strong> — adults: 30 compressions to 2 breaths, ~2 inches deep, 100–120 per minute. Continue until AED arrives or victim breathes.</li>
          <li><strong>AED</strong> — power on, follow voice prompts, expose chest, attach pads (upper right, lower left), allow analyze, deliver shock if advised, resume CPR immediately.</li>
          <li><strong>Suspected spinal injury</strong> — keep head/neck stabilized in line, use a backboard, do not remove from water without proper technique.</li>
        </ul>
        <p>Bleeding, breaks, sunstroke, and hypothermia are routine first-aid topics. CPOs ensure supplies are stocked and unexpired.</p>`
      },
      {
        title:"Chemical Safety & Storage",
        body:`<p>Pool chemicals are oxidizers, acids, and bases — incompatible if mixed.</p>
        <p><strong>Storage rules (OSHA / NFPA / SDS):</strong></p>
        <ul>
          <li>Cool, dry, ventilated, dedicated room.</li>
          <li>Acids stored away from chlorine and other oxidizers; ideally in a separate cabinet.</li>
          <li>Original manufacturer containers; clearly labeled; shelves below eye level.</li>
          <li>Liquid storage on secondary containment (spill trays).</li>
          <li>Safety Data Sheets (SDS) accessible to staff at all times.</li>
        </ul>
        <p><strong>PPE</strong>: chemical-splash goggles, nitrile gloves, apron or splash suit, N95 (DE), full face shield for liquid acid handling. <strong>Eye-wash station</strong> within 10 seconds of any chemical-handling area, tested weekly.</p>
        <p>Spills: small spills — neutralize and absorb with appropriate kit; large or gas-releasing spills — evacuate, call 911, ventilate.</p>`
      },
      {
        title:"Lightning, Severe Weather & Heat",
        body:`<p>Common weather rule: clear pools at the <strong>first lightning flash or thunder</strong>; remain closed until 30 minutes have passed since the last observed flash/thunder. Many CPOs use a 6-second flash-to-bang rule (≤ 6 seconds = ~1.2 miles, evacuate).</p>
        <p>Outdoor pools with no lightning detector should monitor weather radar plus the audible thunder rule.</p>
        <p>Heat: monitor heat index above 95 °F; provide rest breaks for staff, water, and shade. Child sunburn is a daily reality — provide shade and post sunscreen reminders.</p>`
      }
    ],

  // ============ MODULE 7: Pool Equipment & Hydraulics ============
  {
    id:"m7",
    title:"Pool Equipment & Hydraulics",
    intro:"The mechanical room is where chemistry meets engineering. This module covers pumps, motors, gauges, valves, heaters, chemical feeders, and how head loss, flow rate, and pipe sizing dictate everything you do on deck.",
    sections:[
      {
        title:"Pumps & Motors",
        body:`<p>The circulation pump is the heart of the pool. Most commercial pools use a <strong>centrifugal end-suction pump</strong>: an electric motor turns an impeller that creates a low-pressure suction at the inlet and pushes water out the discharge.</p>
        <p>Key pump terms:</p>
        <ul>
          <li><strong>Flow rate (gpm)</strong> — gallons per minute the pump moves at a given resistance.</li>
          <li><strong>Total Dynamic Head (TDH)</strong> — total resistance the pump must overcome (feet of water column).</li>
          <li><strong>Pump curve</strong> — manufacturer chart showing flow vs. TDH; selecting a pump means matching the curve to the system.</li>
          <li><strong>Variable Frequency Drive (VFD)</strong> — controls motor speed; modern energy-efficient retrofit.</li>
        </ul>
        <p>Strainer baskets must be inspected and cleared at least weekly. A clogged basket starves the pump, reducing flow, and can cause cavitation that damages the impeller.</p>`
      },
      {
        title:"Gauges, Valves & Flow Meters",
        body:`<p>Three gauges run the show in any mechanical room:</p>
        <ul>
          <li><strong>Compound gauge</strong> at pump inlet — reads vacuum (in. Hg) and low pressure.</li>
          <li><strong>Pressure gauge</strong> at filter inlet — clean baseline + 8–10 psi triggers cleaning.</li>
          <li><strong>Flow meter</strong> on return line — confirms turnover rate; a target gpm is calculated from pool volume.</li>
        </ul>
        <p><strong>Common valves:</strong> ball (full flow shut-off), butterfly (large pipe shut-off), gate (legacy), check (one-way), multiport (filter selector with FILTER / BACKWASH / RINSE / WASTE / RECIRCULATE / CLOSED).</p>
        <p>Always shut off the pump before turning a multiport valve — the pressure surge will tear the spider gasket and bypass your filter.</p>`
      },
      {
        title:"Hydraulics & Head Loss",
        body:`<p>Water moving through pipes loses energy to friction. <strong>Head loss</strong> is measured in feet of water column. Standard pipe-sizing rules to keep head loss reasonable:</p>
        <ul>
          <li>Suction (inlet) lines: ≤ 6 ft/sec — undersized suction causes cavitation.</li>
          <li>Discharge (return) lines: ≤ 8 ft/sec — undersized return wastes power.</li>
          <li>Copper tube: ≤ 8 ft/sec.</li>
        </ul>
        <p>Each fitting (90° elbow, tee, valve) adds &ldquo;equivalent feet&rdquo; of pipe. A 2&quot; 90° elbow ≈ 5.2 ft of pipe; a 2&quot; gate valve ≈ 1.4 ft; a 2&quot; check valve ≈ 14 ft. The system designer adds it all up to find TDH and pick a matching pump.</p>
        <p>Field-side: oversized pipes are forgiving; undersized pipes are not. If a system runs hot, vibrates, or never reaches its rated flow, suspect head loss.</p>`
      },
      {
        title:"Heaters & Chemical Feeders",
        body:`<p><strong>Heater types:</strong></p>
        <ul>
          <li><strong>Gas (natural / propane)</strong> — fast heat, common in commercial pools.</li>
          <li><strong>Electric resistance</strong> — small pools / spas.</li>
          <li><strong>Heat pump</strong> — energy-efficient electric; slow recovery.</li>
          <li><strong>Solar</strong> — panel array; supplemental.</li>
        </ul>
        <p>Heater longevity depends on water balance — low pH and low calcium hardness eat copper headers and heat exchangers. Maintain LSI within ±0.3.</p>
        <p><strong>Chemical feeder types:</strong></p>
        <ul>
          <li><strong>Erosion feeder</strong> — water flows through a chamber holding tablets (trichlor or bromine); simplest design.</li>
          <li><strong>Peristaltic / diaphragm pump</strong> — meters liquid sodium hypochlorite, acid, or muriatic from a day tank.</li>
          <li><strong>Salt-chlorine generator</strong> — electrolytic cell; produces chlorine on-site.</li>
        </ul>
        <p>All chemical injection should be downstream of the heater to protect the heat exchanger from concentrated chemicals.</p>`
      },
      {
        title:"Skimmers, Returns & Main Drains",
        body:`<p><strong>Skimmers</strong> sit at water level, capturing surface debris and floating oils. Most pools have one skimmer per ~500 sq ft of surface. Skimmer flow is roughly 80% of total return; the remaining 20% comes from the main drain — required for full water-column circulation.</p>
        <p><strong>Return inlets</strong> are positioned to push surface water toward skimmers. Adjust the eyeball fittings down or sideways to circulate the entire pool — never aim them up, which kicks debris back to the bottom.</p>
        <p><strong>Main drains</strong> on a single drain require a secondary anti-entrapment system per VGB; dual drains must be ≥ 3 ft apart. Inspect covers monthly for cracks; replace per manufacturer life (5–7 yrs).</p>`
      }
    ],
    miniQuizzes:[
      {
        afterSection:2,
        title:"Mini Quiz — Pumps & Gauges",
        questions:[

          <li>Check filter pressure and pump operation.</li>

          <li>Verify rescue equipment, AED, first-aid kit, signage.</li>
          <li>Walk perimeter for hazards.</li>

        <p><strong>Pool opening (spring):</strong> remove cover, brush walls, vacuum, balance chemistry slowly (TA → CH → pH → chlorine), recoat DE if applicable, prime pump, run continuous filtration for 24+ hours, then test before opening.</p>

// ---------------- APP STATE & STORAGE ----------------
const STORAGE_KEY = "cpo_app_v1";
const EXAM_QUESTIONS = 55;
const EXAM_DURATION_MS = 3 * 60 * 60 * 1000; // 3 hours
const EXAM_PASS_PCT = 70;
const MODULE_PASS_PCT = 80;

let state = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return {
    profiles:{},        // { profileId: { name, pin, createdAt, progress, examEndAt, currentExam } }
    currentProfileId:null,
    screen:"welcome",
    nav:{}
  };
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function currentUser(){ return state.currentProfileId ? state.profiles[state.currentProfileId] : null; }
function ensureProgress(user){
  if(!user.progress) user.progress = {};
  MODULES.forEach(m=>{
    if(!user.progress[m.id]) user.progress[m.id] = {bestScore:0, completed:false, miniBest:{}, lastSection:0};
  });
}

// ---------------- ROUTING ----------------
function go(screen, nav){ state.screen = screen; state.nav = nav || {}; saveState(); render(); }

function render(){
  const main = document.getElementById("main");
  const topnav = document.getElementById("topnav");
  // top nav
  const u = currentUser();
  topnav.innerHTML = "";
  if (u){
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = "Signed in · " + u.name;
    topnav.appendChild(who);
    if (state.screen !== "welcome"){
      const dash = document.createElement("button");
      dash.className = "btn-link"; dash.textContent = "Dashboard";
      dash.onclick = ()=>go("dashboard");
      topnav.appendChild(dash);
    }
    const out = document.createElement("button");
    out.className = "btn-link"; out.textContent = "Log out";
    out.onclick = ()=>{ state.currentProfileId = null; go("welcome"); };
    topnav.appendChild(out);
  }
  // body
  switch(state.screen){
    case "welcome": return renderWelcome(main);
    case "createProfile": return renderCreateProfile(main);
    case "login": return renderLogin(main);
    case "dashboard": return renderDashboard(main);
    case "module": return renderModule(main);
    case "moduleQuiz": return renderModuleQuiz(main);
    case "exam": return renderFinalExam(main);
    case "examResults": return renderExamResults(main);
    default: return renderWelcome(main);
  }
}

function renderModule(main){
  const u = currentUser(); if (!u){ go("welcome"); return; }
  const m = MODULES.find(x=>x.id===state.nav.moduleId);

  ensureProgress(u);
  const p = u.progress[m.id];
  const idx = MODULES.indexOf(m);

  let html = `<div class="wrap">
    <div class="module-head">
      <div class="module-eyebrow">Module ${idx+1} of ${MODULES.length}</div>

      <p class="module-intro">${escapeHtml(m.intro)}</p>

      <div class="module-meta">Best completion score: ${p.bestScore||0}%</div>

  m.sections.forEach((s,si)=>{
    html += `<div class="section-card"><div class="section-num">Section ${si+1}</div><h2 class="section-title">${escapeHtml(s.title)}</h2><div class="section-body">${s.body}</div></div>`;

    html += `<div class="quiz-block ${p.completed?'completion':''}">
      <div class="quiz-eyebrow">Module Completion</div>
      <h2 class="quiz-title">${escapeHtml(m.completionQuiz.title)}</h2>

      <button class="btn-primary" id="startCompletion">${p.completed?"Retake completion quiz":"Take completion quiz"}</button>
    </div>`;
  }

  // module nav
  html += `<div class="module-nav">
    <button class="btn-ghost" id="backDash">← Back to dashboard</button>
    ${idx>0?`<button class="btn-ghost" id="prevMod">Previous module</button>`:""}
    ${idx<MODULES.length-1?`<button class="btn-ghost" id="nextMod">Next module →</button>`:""}
  </div></div>`;

  main.innerHTML = html;
  document.getElementById("backDash").onclick = ()=>go("dashboard");
  if (document.getElementById("prevMod")) document.getElementById("prevMod").onclick = ()=>go("module",{moduleId:MODULES[idx-1].id});
  if (document.getElementById("nextMod")) document.getElementById("nextMod").onclick = ()=>go("module",{moduleId:MODULES[idx+1].id});
  if (document.getElementById("startCompletion")) document.getElementById("startCompletion").onclick = ()=>go("moduleQuiz",{moduleId:m.id});
  attachMiniQuizHandlers(m);
}

function renderMiniQuiz(m, mq){
  const u = currentUser();
  const p = u.progress[m.id];
  const key = "mq_"+m.id+"_"+mq.afterSection;
  const best = p.miniBest[key]||0;
  let html = `<div class="quiz-block" data-mqkey="${key}">
    <div class="quiz-eyebrow">Mini quiz</div>
    <h3 class="quiz-title">${escapeHtml(mq.title)}</h3>
    <p class="quiz-sub">${mq.questions.length} questions · best score: ${best}%</p>
    <div class="quiz-body">`;
  mq.questions.forEach((q,qi)=>{
    html += `<div class="q-card" data-q="${qi}"><div class="q-text">${qi+1}. ${escapeHtml(q.q)}</div><div class="opts">`;
    q.a.forEach((opt,oi)=>{
      html += `<button class="opt" data-opt="${oi}">${String.fromCharCode(65+oi)}. ${escapeHtml(opt)}</button>`;
    });
    html += `</div><div class="feedback" style="display:none"></div></div>`;
  });
  html += `</div><div class="quiz-foot"><button class="btn-primary" data-mq-submit>Score quiz</button><div class="quiz-result" style="display:none"></div></div></div>`;
  return html;
}

function attachMiniQuizHandlers(m){
  document.querySelectorAll("[data-mqkey]").forEach(block=>{
    block.querySelectorAll(".q-card").forEach(qc=>{
      qc.querySelectorAll(".opt").forEach(opt=>{
        opt.onclick = ()=>{
          qc.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
          opt.classList.add("selected");
        };
      });
    });
    block.querySelector("[data-mq-submit]").onclick = ()=>scoreMiniQuiz(m, block);
  });
}

function scoreMiniQuiz(m, block){
  const key = block.getAttribute("data-mqkey");
  const mq = m.miniQuizzes.find(q=>"mq_"+m.id+"_"+q.afterSection===key);
  let correct = 0;
  block.querySelectorAll(".q-card").forEach((qc,qi)=>{
    const sel = qc.querySelector(".opt.selected");
    const q = mq.questions[qi];
    qc.querySelectorAll(".opt").forEach((opt,oi)=>{
      opt.classList.remove("correct","wrong");
      if (oi===q.c) opt.classList.add("correct");
      if (sel===opt && oi!==q.c) opt.classList.add("wrong");
      opt.disabled = true;
    });
    const fb = qc.querySelector(".feedback");
    if (sel){
      const oi = parseInt(sel.getAttribute("data-opt"));
      if (oi===q.c){ correct++; fb.className="feedback ok"; fb.innerHTML = "✓ Correct. " + q.e; }
      else { fb.className="feedback bad"; fb.innerHTML = "✗ The correct answer is " + String.fromCharCode(65+q.c) + ". " + q.e; }
    } else {
      fb.className="feedback bad"; fb.innerHTML = "No answer — the correct answer is " + String.fromCharCode(65+q.c) + ". " + q.e;
    }
    fb.style.display="block";
  });
  const pct = Math.round(correct/mq.questions.length*100);
  const u = currentUser();
  ensureProgress(u);
  const p = u.progress[m.id];
  if (!p.miniBest[key] || p.miniBest[key] < pct) p.miniBest[key] = pct;
  saveState();
  const result = block.querySelector(".quiz-result");
  result.style.display="block";
  result.innerHTML = `You scored <strong>${correct}/${mq.questions.length} (${pct}%)</strong>. <button class="btn-ghost" data-retry>Retry quiz</button>`;
  result.querySelector("[data-retry]").onclick = ()=>{
    block.querySelectorAll(".opt").forEach(o=>{ o.disabled=false; o.classList.remove("selected","correct","wrong"); });
    block.querySelectorAll(".feedback").forEach(f=>f.style.display="none");
    result.style.display="none";
  };
}

        else { fb.className="feedback bad"; fb.innerHTML="✗ Correct answer: " + String.fromCharCode(65+q.c) + ". " + q.e; }
      } else {
        fb.className="feedback bad"; fb.innerHTML="No answer — correct: " + String.fromCharCode(65+q.c) + ". " + q.e;
      }
      fb.style.display="block";
    });
    const pct = Math.round(correct/cq.questions.length*100);
    const u = currentUser();
    ensureProgress(u);
    const p = u.progress[m.id];
    if (pct > (p.bestScore||0)) p.bestScore = pct;
    if (pct >= MODULE_PASS_PCT) p.completed = true;
    saveState();
    const result = document.getElementById("cqResult");
    result.style.display="block";
    result.innerHTML = `<div class="result-card ${pct>=MODULE_PASS_PCT?'pass':'fail'}">
      <div class="result-eyebrow">${pct>=MODULE_PASS_PCT?"Module complete":"Keep going"}</div>
      <div class="result-score">${pct}%</div>
      <div class="result-meta">You scored ${correct} of ${cq.questions.length}.</div>
      <div class="result-actions">
        <button class="btn-primary" id="cqDash">Back to dashboard</button>
        <button class="btn-ghost" id="cqRetry">Retake quiz</button>
      </div>
    </div>`;
    document.getElementById("cqDash").onclick = ()=>go("dashboard");
    document.getElementById("cqRetry").onclick = ()=>go("moduleQuiz",{moduleId:m.id});
    if (pct>=MODULE_PASS_PCT) toast("Module complete! 🎉");
  };
}

// ---------------- FINAL EXAM ----------------
function startFinalExam(){
  const u = currentUser(); if (!u){ go("welcome"); return; }
  ensureProgress(u);
  const allComplete = MODULES.every(m=>u.progress[m.id].completed);
  if (!allComplete){ toast("Complete all 8 modules to unlock the final exam."); return; }
  // resume if existing
  if (u.examEndAt && Date.now() < u.examEndAt && u.currentExam){
    go("exam"); return;
  }
  // build new exam: random shuffle, take EXAM_QUESTIONS
  const shuffled = FINAL_EXAM_POOL.slice().sort(()=>Math.random()-0.5).slice(0, EXAM_QUESTIONS);
  u.currentExam = {
    questions: shuffled,
    answers: new Array(shuffled.length).fill(null),
    current: 0,
    startedAt: Date.now()
  };
  u.examEndAt = Date.now() + EXAM_DURATION_MS;
  saveState();
  go("exam");
}

let examTimerInterval = null;

function renderFinalExam(main){
  const u = currentUser(); if (!u || !u.currentExam){ go("dashboard"); return; }
  const exam = u.currentExam;
  const remaining = ()=>Math.max(0, u.examEndAt - Date.now());
  if (remaining()<=0){ submitFinalExam(true); return; }
  const q = exam.questions[exam.current];
  let html = `
    <div class="exam-shell">
      <div class="exam-bar">
        <div class="exam-bar-info">
          <div class="exam-bar-eye">Final Mock Exam</div>
          <div class="exam-bar-q">Question ${exam.current+1} of ${exam.questions.length}</div>
        </div>
        <div class="timer" id="examTimer">${fmtClock(remaining())}</div>
        <button class="btn-link" id="examSubmitNow">Submit exam</button>
      </div>
      <div class="exam-body">
        <div class="exam-q">${escapeHtml(q.q)}</div>
        <div class="opts exam-opts">
          ${q.a.map((opt,oi)=>`<button class="opt ${exam.answers[exam.current]===oi?'selected':''}" data-opt="${oi}">${String.fromCharCode(65+oi)}. ${escapeHtml(opt)}</button>`).join("")}
        </div>
        <div class="exam-foot">
          <button class="btn-ghost" id="examPrev" ${exam.current===0?'disabled':''}>← Previous</button>
          <div class="exam-pager">${pagerHtml(exam)}</div>
          <button class="btn-primary" id="examNext">${exam.current===exam.questions.length-1?'Review & submit':'Next →'}</button>
        </div>
      </div>
    </div>`;
  main.innerHTML = html;
  // tick timer
  if (examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    const t = remaining();
    const tEl = document.getElementById("examTimer");
    if (!tEl){ clearInterval(examTimerInterval); return; }
    tEl.textContent = fmtClock(t);
    tEl.classList.toggle("warn", t < 30*60*1000 && t >= 5*60*1000);
    tEl.classList.toggle("danger", t < 5*60*1000);
    if (t<=0){ clearInterval(examTimerInterval); submitFinalExam(true); }
  }, 1000);
  // option clicks
  document.querySelectorAll(".exam-opts .opt").forEach(opt=>{
    opt.onclick = ()=>{
      exam.answers[exam.current] = parseInt(opt.getAttribute("data-opt"));
      saveState();
      document.querySelectorAll(".exam-opts .opt").forEach(o=>o.classList.remove("selected"));
      opt.classList.add("selected");
      // refresh pager
      document.querySelector(".exam-pager").innerHTML = pagerHtml(exam);
      attachPagerHandlers(exam);
    };
  });
  document.getElementById("examPrev").onclick = ()=>{ if (exam.current>0){ exam.current--; saveState(); render(); }};
  document.getElementById("examNext").onclick = ()=>{
    if (exam.current<exam.questions.length-1){ exam.current++; saveState(); render(); }
    else { confirmAndSubmit(); }
  };
  document.getElementById("examSubmitNow").onclick = confirmAndSubmit;
  attachPagerHandlers(exam);
}

function pagerHtml(exam){
  return exam.questions.map((_,i)=>`<button class="pgr ${exam.answers[i]!=null?'answered':''} ${i===exam.current?'now':''}" data-i="${i}">${i+1}</button>`).join("");
}
function attachPagerHandlers(exam){
  document.querySelectorAll(".exam-pager .pgr").forEach(p=>{
    p.onclick = ()=>{ exam.current = parseInt(p.getAttribute("data-i")); saveState(); render(); };
  });
}
function confirmAndSubmit(){
  const u = currentUser();
  const unanswered = u.currentExam.answers.filter(a=>a==null).length;
  const msg = unanswered ? `Submit exam? You have ${unanswered} unanswered question${unanswered===1?'':'s'}.` : "Submit exam now?";
  if (confirm(msg)) submitFinalExam(false);
}

function submitFinalExam(byTimer){
  if (examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval=null; }
  const u = currentUser();
  const exam = u.currentExam;
  let correct = 0;
  exam.questions.forEach((q,i)=>{ if (exam.answers[i]===q.c) correct++; });
  const pct = Math.round(correct/exam.questions.length*100);
  exam.completedAt = Date.now();
  exam.score = pct;
  exam.correct = correct;
  exam.byTimer = byTimer;
  if (u.examBest==null || pct > u.examBest) u.examBest = pct;
  u.examEndAt = null;
  u.lastExam = exam;
  u.currentExam = null;
  saveState();
  go("examResults");
}

function renderExamResults(main){
  const u = currentUser(); if (!u || !u.lastExam){ go("dashboard"); return; }
  const exam = u.lastExam;
  const passed = exam.score >= EXAM_PASS_PCT;
  let html = `<div class="wrap">
    <div class="result-card ${passed?'pass':'fail'}">
      <div class="result-eyebrow">${passed?"You passed!":"Not quite — keep practicing"}</div>
      <div class="result-score">${exam.score}%</div>
      <div class="result-meta">${exam.correct} of ${exam.questions.length} correct${exam.byTimer?" · time expired":""} · pass mark ${EXAM_PASS_PCT}%</div>
      <div class="result-actions">
        <button class="btn-primary" id="resDash">Back to dashboard</button>
        <button class="btn-ghost" id="resRetake">Retake exam</button>
      </div>
    </div>
    <h2 class="section-h">Review every question</h2>
    <div class="review-list">`;
  exam.questions.forEach((q,i)=>{
    const ans = exam.answers[i];
    const isRight = ans===q.c;
    html += `<div class="review-q ${isRight?'ok':'bad'}">
      <div class="review-num">Q${i+1} ${isRight?'✓':'✗'}</div>
      <div class="review-text">${escapeHtml(q.q)}</div>
      <div class="opts">`;
    q.a.forEach((opt,oi)=>{
      let cls = "opt review-opt";
      if (oi===q.c) cls += " correct";
      if (oi===ans && oi!==q.c) cls += " wrong";
      html += `<div class="${cls}">${String.fromCharCode(65+oi)}. ${escapeHtml(opt)} ${oi===ans?'<span class="your">(your answer)</span>':''}</div>`;
    });
    html += `</div><div class="feedback ${isRight?'ok':'bad'}">${q.e}</div></div>`;
  });
  html += `</div></div>`;
  main.innerHTML = html;
  document.getElementById("resDash").onclick = ()=>go("dashboard");
  document.getElementById("resRetake").onclick = ()=>{ u.lastExam = null; saveState(); startFinalExam(); };
}

// ---------------- HELPERS ----------------
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtClock(ms){
  const s = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 3000);
}

// ---------------- BOOT ----------------
// If a profile is signed in but no exam in progress, default to dashboard
if (state.currentProfileId && state.profiles[state.currentProfileId]){
  ensureProgress(state.profiles[state.currentProfileId]);
  if (state.screen === "welcome") state.screen = "dashboard";
} else {
  state.screen = "welcome";
}
render();

</script>

<div id="pwa-install-banner" class="pwa-banner" role="dialog" aria-live="polite" aria-label="Install CPO Training" hidden>
  <div class="pwa-banner__inner">
    <div class="pwa-banner__icon" aria-hidden="true">

    </div>

      <button id="pwa-install-dismiss" class="pwa-banner__close" type="button" aria-label="Dismiss">&times;</button>

</div>
<style>
  .pwa-banner{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:max(16px, env(safe-area-inset-bottom));

  .pwa-banner__copy{ display:flex; flex-direction:column; line-height:1.3; flex:1; min-width:0; }

  @media (max-width:480px){
    .pwa-banner__inner{ flex-wrap:wrap; }
    .pwa-banner__copy{ flex:1 1 65%; }
    .pwa-banner__actions{ flex:1 1 100%; justify-content:flex-end; }
  }
</style>

<script>
(function(){
  // ---- Service worker registration ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .then(function(reg) {
          // Detect updates
          reg.addEventListener('updatefound', function() {
            var sw = reg.installing;
            if (!sw) return;
            // (silent updates: new SW activates in background; users see fresh content on next launch)
          });
        })
        .catch(function(err){ console.warn('[PWA] SW registration failed', err); });

      
    });
  }

  // ---- Install prompt ----
  var deferredPrompt = null;
  var DISMISS_KEY = 'cpoPwaInstallDismissed';
  var dismissedAt = parseInt(localStorage.getItem(DISMISS_KEY) || '0', 10);
  // Re-show after 14 days
  var dismissedRecently = dismissedAt && (Date.now() - dismissedAt) < (1000 * 60 * 60 * 24 * 14);

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function showInstallBanner(){
    if (dismissedRecently || isStandalone()) return;
    var banner = document.getElementById('pwa-install-banner');
    if (!banner) return;
    banner.hidden = false;
  }

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    showInstallBanner();
  });

  document.addEventListener('DOMContentLoaded', function(){
    var dismiss = document.getElementById('pwa-install-dismiss');
    var install = document.getElementById('pwa-install-btn');
    if (dismiss) dismiss.addEventListener('click', function(){
      localStorage.setItem(DISMISS_KEY, String(Date.now()));
      var b = document.getElementById('pwa-install-banner'); if (b) b.hidden = true;
    });
    if (install) install.addEventListener('click', async function(){
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try {
        var choice = await deferredPrompt.userChoice;
        if (choice && choice.outcome !== 'accepted') {
          localStorage.setItem(DISMISS_KEY, String(Date.now()));
        }
      } catch(_){}
      deferredPrompt = null;
      var b = document.getElementById('pwa-install-banner'); if (b) b.hidden = true;
    });

    // iOS Safari has no beforeinstallprompt — show a one-time hint
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
    if (isIOS && isSafari && !isStandalone() && !dismissedRecently) {
      var banner = document.getElementById('pwa-install-banner');
      var copy = banner && banner.querySelector('.pwa-banner__copy');
      var actions = banner && banner.querySelector('.pwa-banner__actions .pwa-banner__btn');
      if (copy) copy.querySelector('span').textContent = 'Tap Share, then "Add to Home Screen" to install.';
      if (actions) actions.style.display = 'none';
      if (banner) banner.hidden = false;
    }
  });

  window.addEventListener('appinstalled', function(){
    var b = document.getElementById('pwa-install-banner'); if (b) b.hidden = true;
  });
})();
</script>
